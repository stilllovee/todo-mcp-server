version: '3.8'

services:
  todo-mcp-server:
    build: .
    ports:
      - "8123:8123"
    environment:
      - NODE_ENV=production
      - PORT=8123
    volumes:
      - todo-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  todo-data:
    driver: local